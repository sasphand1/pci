services:
  public-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_ADAPTER_API_URL: ${NEXT_PUBLIC_ADAPTER_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      ADAPTER_INTERNAL_URL: ${ADAPTER_INTERNAL_URL:-http://host.docker.internal:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
