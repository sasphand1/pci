services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pci
      POSTGRES_USER: pci
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pci -d pci"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  migrate:
    build: .
    restart: 'no'
    command: ["node", "dist/cli/migrate.js"]
    environment: &app_env
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://pci:${DB_PASSWORD}@db:5432/pci
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Set ADMIN_ORIGIN}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      LOG_HMAC_KEY: ${LOG_HMAC_KEY:?Set LOG_HMAC_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      INSTAGRAM_GRAPH_ACCESS_TOKEN: ${INSTAGRAM_GRAPH_ACCESS_TOKEN:-}
      INSTAGRAM_GRAPH_OWNER_ID: ${INSTAGRAM_GRAPH_OWNER_ID:-}
      INSTAGRAM_SYNC_ENABLED: ${INSTAGRAM_SYNC_ENABLED:-false}
      YOUTUBE_SYNC_ENABLED: ${YOUTUBE_SYNC_ENABLED:-false}
      YOUTUBE_DAILY_SOFT_LIMIT: ${YOUTUBE_DAILY_SOFT_LIMIT:-8000}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      DEV_BYPASS_TURNSTILE: ${DEV_BYPASS_TURNSTILE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      WALL_MESSAGE_RETENTION_DAYS: ${WALL_MESSAGE_RETENTION_DAYS:-7}
      PUBLIC_CACHE_TTL_SECONDS: ${PUBLIC_CACHE_TTL_SECONDS:-300}
      SYNC_VIDEOS_PER_CHANNEL: ${SYNC_VIDEOS_PER_CHANNEL:-50}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *app_env
      PORT: 8080
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
    networks: [internal]
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]
volumes:
  pg_data:
  redis_data:
networks:
  internal:
