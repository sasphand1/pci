<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCI Satellite — Earth and Pakistan map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.21.0/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;width:100%;margin:0;background:#020a14;font-family:system-ui,sans-serif}
#map{position:absolute;inset:0}
#status{position:absolute;left:12px;bottom:18px;z-index:2;background:#071522e8;color:#d4edf8;border:1px solid #31647c;border-radius:7px;padding:8px 10px;font-size:12px;max-width:70%;pointer-events:none}
#source{position:absolute;top:12px;left:12px;z-index:2;background:#071522e8;color:#b2d8e9;border:1px solid #31647c;border-radius:7px;padding:7px 10px;font-size:11px;pointer-events:none}
.btn{position:absolute;right:12px;z-index:5;border:1px solid #29627b;border-radius:7px;background:#071522ee;color:#e0f4fd;padding:8px 12px;font-weight:600;font-size:12px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
#view-toggle{top:10px;background:#0e796c;border-color:#6cdec3}
#layer-toggle{top:50px}
#imagery-toggle{display:none;top:90px}#gpm-toggle{display:none;top:130px}
.pak #imagery-toggle,.pak #gpm-toggle{display:block}
#legend{position:absolute;right:12px;bottom:18px;z-index:2;background:#071522e8;color:#cfe6f1;border:1px solid #31647c;border-radius:7px;padding:7px 9px;font-size:11px;line-height:1.7;pointer-events:none}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
</style></head><body>
<div id="map" role="region" aria-label="Rotating Earth with live satellites; zooms to a fixed Pakistan observation map"></div>
<div id="source">PCI Earth Intelligence · Verified observations</div>
<div id="status" role="status">Waiting for observations…</div>
<div id="legend"><span><i style="background:#9fe8ff"></i>Satellites (live)</span><br><span><i style="background:#ff785c"></i>Heat detections</span><br><span><i style="background:#ffd166"></i>Earthquakes</span><br><span><i style="background:#ff3b5c"></i>Disaster alerts</span></div>
<button id="view-toggle" class="btn" type="button">Zoom to Pakistan</button>
<button id="layer-toggle" class="btn" type="button" disabled>Layer: none</button>
<button id="imagery-toggle" class="btn" type="button" disabled aria-pressed="false">NASA imagery: unavailable</button>
<button id="gpm-toggle" class="btn" type="button" disabled aria-pressed="false">IMERG rain: unavailable</button>
<script src="https://unpkg.com/maplibre-gl@5.21.0/dist/maplibre-gl.js"></script>
<script src="/satellite-orbits.js"></script>
<script>
'use strict';
(function(){
  const status=document.getElementById('status');
  if(!window.maplibregl){status.textContent='Map library unavailable';return;}
  let points=[],events=[],quakes=[],alerts=[],orbits=[];let loaded=false;let category='farm';
  let imageryUrl=null,imageryVisible=false,gpmUrl=null,gpmVisible=false,extraLayers=[],activeExtra=-1;
  let mode='globe';let spin=null;let lastFrame=0;
  const toggle=document.getElementById('imagery-toggle'),gpmToggle=document.getElementById('gpm-toggle'),layerToggle=document.getElementById('layer-toggle'),viewToggle=document.getElementById('view-toggle');
  // Only approved NASA GIBS WMTS layers (night lights, aerosol, snow) are accepted from the parent page.
  const EXTRA_RE=/^https:\/\/gibs\.earthdata\.nasa\.gov\/wmts\/epsg3857\/best\/(VIIRS_SNPP_DayNightBand_ENCC|MODIS_Combined_Value_Added_AOD|MODIS_Terra_NDSI_Snow_Cover)\/default\/\d{4}-\d{2}-\d{2}\/GoogleMapsCompatible_Level[6-9]\/\{z\}\/\{y\}\/\{x\}\.(png|jpg)$/;
  const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Pakistan is the fixed geographic focal point of the detail view. Visitors cannot pan or zoom the map.
  const PAKISTAN_VIEW=[[60.6,23.3],[77.7,37.3]];
  const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/dark',center:[69.3,25],zoom:1.3,
   attributionControl:true,interactive:false,scrollZoom:false,boxZoom:false,dragRotate:false,dragPan:false,
   keyboard:false,doubleClickZoom:false,touchZoomRotate:false,pitchWithRotate:false});
  function fitPakistan(){map.fitBounds(PAKISTAN_VIEW,{padding:{top:30,bottom:30,left:30,right:30},animate:false});}
  function globeZoom(){return Math.max(0.6,Math.log2(Math.min(window.innerWidth,window.innerHeight)/300)+0.9);}

  const fc=features=>({type:'FeatureCollection',features});
  const pt=(lon,lat,props)=>({type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:props});
  const data=()=>fc(points.map(p=>pt(p.longitude,p.latitude,{observedAt:p.observedAt||''})));
  const eventData=()=>fc(events.map(e=>pt(e.longitude,e.latitude,{title:e.title})));
  const quakeData=()=>fc(quakes.map(q=>pt(q.longitude,q.latitude,{mag:q.magnitude})));
  const alertData=()=>fc(alerts.map(a=>pt(a.longitude,a.latitude,{level:a.level,name:a.name})));
  function satData(){
   const now=Date.now(),feats=[];
   for(const o of orbits){const q=window.PCIOrbits&&window.PCIOrbits.position(o,now);if(q)feats.push(pt(q.longitude,q.latitude,{name:o.name,label:o.isIss?'ISS':/TIANHE|CSS/i.test(o.name)?'Tiangong':'',alt:Math.round(q.altitudeKm)}));}
   return fc(feats);
  }
  function trackData(){
   const iss=orbits.find(o=>o.isIss);if(!iss||!window.PCIOrbits)return fc([]);
   return fc(window.PCIOrbits.track(iss,Date.now(),95,60).map(c=>({type:'Feature',geometry:{type:'LineString',coordinates:c},properties:{}})));
  }
  const layerSets={
   agriculture:{hotspots:true,events:false,imagery:false,gpm:true},
   land:{hotspots:false,events:false,imagery:true,gpm:false},
   water:{hotspots:false,events:false,imagery:false,gpm:true},
   energy:{hotspots:false,events:false,imagery:false,gpm:false},
   environment:{hotspots:true,events:true,imagery:false,gpm:false},
   cities:{hotspots:false,events:false,imagery:true,gpm:false},
   disasters:{hotspots:true,events:true,imagery:false,gpm:true},
   discover:{hotspots:true,events:true,imagery:true,gpm:false},
   farm:{hotspots:true,events:false,imagery:false,gpm:true},
   safety:{hotspots:true,events:true,imagery:false,gpm:true},
   solar:{hotspots:false,events:false,imagery:true,gpm:false},
   city:{hotspots:false,events:false,imagery:true,gpm:false}
  };
  const GLOBE={hotspots:true,events:true,imagery:true,gpm:false};
  const vis=(id,on)=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none');};
  function showExtra(index){activeExtra=index;
   extraLayers.forEach((l,i)=>vis('extra-'+l.id,i===index));
   layerToggle.disabled=extraLayers.length===0;
   layerToggle.textContent=extraLayers.length===0?'Layer: none':'Layer: '+(index<0?'Off':extraLayers[index].label);
  }
  function updateLayers(){if(!loaded)return;
   const desired=mode==='globe'?GLOBE:(layerSets[category]||layerSets.farm);
   vis('hotspots',desired.hotspots);vis('hotspots-halo',desired.hotspots);vis('natural-events',desired.events);
   vis('nasa-imagery',desired.imagery);vis('gpm-imagery',desired.gpm);
   for(const id of ['satellites','satellite-labels','iss-track'])vis(id,mode==='globe');
   imageryVisible=Boolean(desired.imagery&&map.getLayer('nasa-imagery'));gpmVisible=Boolean(desired.gpm&&map.getLayer('gpm-imagery'));
   toggle.textContent=imageryUrl?'NASA imagery: '+(imageryVisible?'On':'Off'):'NASA imagery: unavailable';
   gpmToggle.textContent=gpmUrl?'IMERG rain: '+(gpmVisible?'On':'Off'):'IMERG rain: unavailable';
   status.textContent=mode==='globe'
    ?`Earth · ${orbits.length} satellites tracked · ${points.length} heat detections · ${quakes.length} earthquakes · ${alerts.length} alerts`
    :`${category.toUpperCase()} · ${desired.hotspots?points.length+' thermal detections · ':''}${desired.events?events.length+' natural events · ':''}${desired.imagery?'NASA imagery · ':''}${desired.gpm?'IMERG visualization · ':''}Pakistan fixed view`;
  }
  function render(){if(!loaded)return;
   for(const [id,f] of [['hotspots',data],['natural-events',eventData],['quakes',quakeData],['alerts',alertData],['satellites',satData],['iss-track',trackData]]){const s=map.getSource(id);if(s)s.setData(f());}
   const below=map.getLayer('hotspots-halo')?'hotspots-halo':undefined;
   if(imageryUrl&&!map.getSource('nasa-imagery')){map.addSource('nasa-imagery',{type:'raster',tiles:[imageryUrl],tileSize:256,maxzoom:9});map.addLayer({id:'nasa-imagery',type:'raster',source:'nasa-imagery',layout:{visibility:'none'},paint:{'raster-opacity':.8}},below);}
   if(gpmUrl&&!map.getSource('gpm-imagery')){map.addSource('gpm-imagery',{type:'raster',tiles:[gpmUrl],tileSize:256,maxzoom:6});map.addLayer({id:'gpm-imagery',type:'raster',source:'gpm-imagery',layout:{visibility:'none'},paint:{'raster-opacity':.65}},below);}
   for(const l of extraLayers){const id='extra-'+l.id;if(!map.getSource(id)){map.addSource(id,{type:'raster',tiles:[l.tileTemplate],tileSize:256,maxzoom:l.maxZoom});map.addLayer({id,type:'raster',source:id,layout:{visibility:'none'},paint:{'raster-opacity':.7}},below);}}
   showExtra(activeExtra<extraLayers.length?activeExtra:-1);
   gpmToggle.disabled=!gpmUrl;toggle.disabled=!imageryUrl;
   updateLayers();
  }
  // Slow eastward rotation while in globe view; satellites move every second.
  function frame(t){
   if(mode!=='globe'||REDUCED){spin=null;return;}
   if(!document.hidden&&lastFrame){const c=map.getCenter();map.jumpTo({center:[((c.lng+(t-lastFrame)*0.004+540)%360)-180,c.lat]});}
   lastFrame=t;spin=requestAnimationFrame(frame);
  }
  function startSpin(){if(!spin&&!REDUCED){lastFrame=0;spin=requestAnimationFrame(frame);}}
  setInterval(()=>{if(loaded&&mode==='globe'&&!document.hidden){const s=map.getSource('satellites');if(s)s.setData(satData());}},1000);
  setInterval(()=>{if(loaded&&mode==='globe'){const s=map.getSource('iss-track');if(s)s.setData(trackData());}},60000);
  function setMode(next){
   mode=next;document.body.classList.toggle('pak',mode==='pakistan');
   if(mode==='pakistan'){if(spin){cancelAnimationFrame(spin);spin=null;}viewToggle.textContent='Back to globe';
    map.flyTo({center:[69.3,30.3],zoom:4.6,duration:REDUCED?0:2600,essential:true});map.once('moveend',()=>{if(mode==='pakistan')fitPakistan();});}
   else{viewToggle.textContent='Zoom to Pakistan';map.flyTo({center:[69.3,25],zoom:globeZoom(),duration:REDUCED?0:2000,essential:true});map.once('moveend',startSpin);}
   updateLayers();
  }
  map.on('load',()=>{loaded=true;
   try{map.setProjection({type:'globe'});}catch{/* older renderer: flat map still works */}
   map.jumpTo({zoom:globeZoom()});
   map.addSource('iss-track',{type:'geojson',data:fc([])});map.addLayer({id:'iss-track',type:'line',source:'iss-track',paint:{'line-color':'#9fe8ff','line-width':1.2,'line-opacity':.55,'line-dasharray':[2,2]}});
   map.addSource('hotspots',{type:'geojson',data:data()});
   map.addLayer({id:'hotspots-halo',type:'circle',source:'hotspots',paint:{'circle-radius':9,'circle-color':'#ff6347','circle-opacity':.2,'circle-stroke-width':0}});
   map.addLayer({id:'hotspots',type:'circle',source:'hotspots',paint:{'circle-radius':4,'circle-color':'#ff785c','circle-stroke-color':'#fff1dc','circle-stroke-width':1,'circle-opacity':.94}});
   map.addSource('natural-events',{type:'geojson',data:eventData()});map.addLayer({id:'natural-events',type:'circle',source:'natural-events',paint:{'circle-radius':6,'circle-color':'#66e0ff','circle-stroke-color':'#e4fbff','circle-stroke-width':2}});
   map.addSource('quakes',{type:'geojson',data:quakeData()});map.addLayer({id:'quakes',type:'circle',source:'quakes',paint:{'circle-radius':['interpolate',['linear'],['get','mag'],2.5,3,7,14],'circle-color':'#ffd166','circle-opacity':.35,'circle-stroke-color':'#ffd166','circle-stroke-width':1.5}});
   map.addSource('alerts',{type:'geojson',data:alertData()});map.addLayer({id:'alerts',type:'circle',source:'alerts',paint:{'circle-radius':10,'circle-color':'rgba(0,0,0,0)','circle-stroke-color':['match',['get','level'],'Red','#ff3b5c','Orange','#ff9f1c','#7bd389'],'circle-stroke-width':3}});
   map.addSource('satellites',{type:'geojson',data:satData()});
   map.addLayer({id:'satellites',type:'circle',source:'satellites',paint:{'circle-radius':['case',['!=',['get','label'],''],5,3],'circle-color':'#9fe8ff','circle-stroke-color':'#ffffff','circle-stroke-width':1}});
   map.addLayer({id:'satellite-labels',type:'symbol',source:'satellites',filter:['!=',['get','label'],''],layout:{'text-field':['get','label'],'text-size':12,'text-offset':[0,1.2],'text-font':['Noto Sans Regular']},paint:{'text-color':'#e0f7ff','text-halo-color':'#020a14','text-halo-width':1.5}});
   render();startSpin();});
  window.addEventListener('resize',()=>{if(!loaded)return;if(mode==='pakistan')fitPakistan();else map.jumpTo({zoom:globeZoom()});});
  map.on('error',()=>{if(!loaded)status.textContent='Map tiles unavailable. Check the connection.';});
  const geo=(p,box)=>p&&typeof p.latitude==='number'&&typeof p.longitude==='number'&&Number.isFinite(p.latitude)&&Number.isFinite(p.longitude)&&(!box||(p.latitude>=23&&p.latitude<=38&&p.longitude>=60&&p.longitude<=78))&&Math.abs(p.latitude)<=90&&Math.abs(p.longitude)<=180;
  const fin=v=>typeof v==='number'&&Number.isFinite(v);
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='PCI_SATELLITE_POINTS_V1'||!Array.isArray(event.data.points))return;
    const d=event.data;
    points=d.points.slice(0,200).filter(p=>geo(p,true)).map(p=>({latitude:p.latitude,longitude:p.longitude,observedAt:typeof p.observedAt==='string'?p.observedAt:null}));
    events=(Array.isArray(d.events)?d.events:[]).slice(0,100).filter(p=>geo(p,true)).map(p=>({latitude:p.latitude,longitude:p.longitude,title:String(p.title||'Natural event').slice(0,160)}));
    quakes=(Array.isArray(d.quakes)?d.quakes:[]).slice(0,200).filter(p=>geo(p)&&fin(p.magnitude)).map(p=>({latitude:p.latitude,longitude:p.longitude,magnitude:Math.min(10,Math.max(0,p.magnitude))}));
    alerts=(Array.isArray(d.alerts)?d.alerts:[]).slice(0,60).filter(p=>geo(p)).map(p=>({latitude:p.latitude,longitude:p.longitude,level:['Red','Orange','Green'].includes(p.level)?p.level:'Green',name:String(p.name||'Alert').slice(0,120)}));
    orbits=(Array.isArray(d.orbits)?d.orbits:[]).slice(0,80).filter(o=>o&&typeof o.epoch==='string'&&['meanMotion','eccentricity','inclination','raOfAscNode','argOfPericenter','meanAnomaly'].every(k=>fin(o[k]))).map(o=>({name:String(o.name||'Satellite').slice(0,60),isIss:o.isIss===true,epoch:o.epoch,meanMotion:o.meanMotion,eccentricity:o.eccentricity,inclination:o.inclination,raOfAscNode:o.raOfAscNode,argOfPericenter:o.argOfPericenter,meanAnomaly:o.meanAnomaly}));
    if(typeof d.category==='string'&&Object.hasOwn(layerSets,d.category))category=d.category;
    const template=d.imagery;
    imageryUrl=(typeof template==='string'&&/^https:\/\/gibs\.earthdata\.nasa\.gov\/wmts\/epsg3857\/best\/MODIS_Terra_CorrectedReflectance_TrueColor\/default\/\d{4}-\d{2}-\d{2}\/GoogleMapsCompatible_Level9\/\{z\}\/\{y\}\/\{x\}\.jpg$/.test(template))?template:null;
    const gpm=d.gpmImagery;
    gpmUrl=(typeof gpm==='string'&&/^https:\/\/gibs\.earthdata\.nasa\.gov\/wms\/epsg3857\/best\/wms\.cgi\?/.test(gpm)&&gpm.includes('IMERG_Precipitation_Rate')&&gpm.includes('{bbox-epsg-3857}'))?gpm:null;
    const incoming=(Array.isArray(d.extraLayers)?d.extraLayers:[]).slice(0,6).filter(l=>l&&typeof l.id==='string'&&/^[a-z0-9-]{1,32}$/.test(l.id)&&typeof l.tileTemplate==='string'&&EXTRA_RE.test(l.tileTemplate)).map(l=>({id:l.id,label:String(l.label||l.id).slice(0,60),tileTemplate:l.tileTemplate,maxZoom:Math.min(9,Math.max(1,Number(l.maxZoom)||6))}));
    // Sources are immutable once added; drop changed layers so the new date is used.
    for(const old of extraLayers){const fresh=incoming.find(l=>l.id===old.id);if(loaded&&(!fresh||fresh.tileTemplate!==old.tileTemplate)){const id='extra-'+old.id;if(map.getLayer(id))map.removeLayer(id);if(map.getSource(id))map.removeSource(id);}}
    extraLayers=incoming;
    if(d.view==='pakistan'&&mode!=='pakistan'&&loaded)setMode('pakistan');
    render();
  });
  viewToggle.addEventListener('click',()=>{if(loaded)setMode(mode==='globe'?'pakistan':'globe');});
  layerToggle.addEventListener('click',()=>{if(!loaded||extraLayers.length===0)return;showExtra(activeExtra+1>=extraLayers.length?-1:activeExtra+1);});
  gpmToggle.addEventListener('click',()=>{if(!loaded||!map.getLayer('gpm-imagery'))return;gpmVisible=!gpmVisible;vis('gpm-imagery',gpmVisible);gpmToggle.textContent='IMERG rain: '+(gpmVisible?'On':'Off');gpmToggle.setAttribute('aria-pressed',String(gpmVisible));});
  toggle.addEventListener('click',()=>{if(!loaded||!map.getLayer('nasa-imagery'))return;imageryVisible=!imageryVisible;vis('nasa-imagery',imageryVisible);toggle.textContent='NASA imagery: '+(imageryVisible?'On':'Off');toggle.setAttribute('aria-pressed',String(imageryVisible));});
})();
</script></body></html>
